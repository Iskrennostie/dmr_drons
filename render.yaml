databases:
  - name: mdr-postgres
    databaseName: mdr
    user: mdr
    region: frankfurt

services:
  - type: web
    name: mdr-drone-studio
    runtime: node
    region: frankfurt
    buildCommand: npm install --omit=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mdr-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: ORDER_NOTIFICATION_EMAIL
        value: itaci3367@gmail.com
      - key: ORDER_EMAIL_FROM
        value: MDR <onboarding@resend.dev>
      - key: RESEND_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
